<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Intelligence Agent</title>
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .card {
            transition: box-shadow 0.2s ease;
        }
        .card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10) !important;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .form-check-input {
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg border-bottom shadow-sm px-4">
    <span class="navbar-brand text-success fs-5">⚡ Inventory Intelligence Agent</span>
    <div class="ms-auto d-flex align-items-center gap-2">
        <span class="text-muted small" id="themeLabel">Light Mode</span>
        <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" role="switch" id="darkModeToggle">
        </div>
    </div>
</nav>

<div class="container mt-5">
    <p class="text-muted">Upload your sales data. Let the AI handle the forecasting and supplier emails.</p>

    <!-- Step 1: Data Upload Layer -->
    <div class="card shadow-sm mb-4 rounded-4">
        <div class="card-header rounded-top-4"><b>1. Sales Data Upload (CSV/Excel)</b></div>
        <div class="card-body">
            <input type="file" class="form-control mb-3" id="csvFile">
            <button class="btn btn-primary" id="analyzeBtn" onclick="analyzeData()">Analyze Data</button>
        </div>
    </div>

    <!-- Step 2: Demand Forecasting Engine (Low Stock Alerts) -->
    <div class="card shadow-sm mb-4 border-warning rounded-4">
        <div class="card-header bg-warning text-dark rounded-top-4"><b>2. Smart Alerts (Low Stock)</b></div>
        <div class="card-body">
            <ul class="list-group" id="alertsList">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Parle-G (50g)
                    <span class="badge bg-danger rounded-pill">Only 12 left</span>
                </li>
            </ul>
        </div>
    </div>

    <!-- Step 3: Agentic Action Layer & Granite AI -->
    <div class="card shadow-sm border-success rounded-4">
        <div class="card-header bg-success text-white rounded-top-4"><b>3. Agentic Action: Supplier Email Draft</b></div>
        <div class="card-body">
            <label>AI-Generated Purchase Order (Powered by IBM Granite):</label>
            <textarea class="form-control mb-3" rows="4" id="emailDraft">Hello Ramesh Distributors,&#10;&#10;Our AI forecasting indicates we are running low on Parle-G (50g). Please process a purchase order for 100 units to be delivered this week.&#10;&#10;Thank you.</textarea>
            <button class="btn btn-success">Approve & Send Email</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// --- Dark Mode Toggle ---
const toggle = document.getElementById('darkModeToggle');
const themeLabel = document.getElementById('themeLabel');

toggle.addEventListener('change', () => {
    if (toggle.checked) {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
        themeLabel.textContent = 'Dark Mode';
    } else {
        document.documentElement.setAttribute('data-bs-theme', 'light');
        themeLabel.textContent = 'Light Mode';
    }
});

// --- Analyze Button: API Call ---
async function analyzeData() {
    const btn        = document.getElementById('analyzeBtn');
    const fileInput  = document.getElementById('csvFile');
    const alertsList = document.getElementById('alertsList');
    const emailDraft = document.getElementById('emailDraft');

    // 1. Guard: stop if no file is selected
    if (!fileInput.files || fileInput.files.length === 0) {
        alert('Please upload a CSV file');
        return;
    }

    // 2. Loading state
    btn.disabled = true;
    btn.innerHTML = `
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        Granite AI is generating insights...
    `;

    try {
        // 3. Build FormData — key MUST be "file" for FastAPI to recognise it
        // No Content-Type header set manually; browser sets multipart/form-data + boundary automatically
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        const response = await fetch('http://10.124.126.153:8005/api/ai-advisor', {
            method: 'POST',
            body: formData
        });

        if (!response.ok) {
            throw new Error(`Server error: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        // DEBUG: verify the shape of the API response in the browser console
        console.log('✅ API response received:', data);

        // 3a. Populate the email draft textarea
        emailDraft.value = data.ai_advice;

        // 3b. Clear the hardcoded alerts and rebuild from API response
        alertsList.innerHTML = '';
        data.items_to_order.forEach(item => {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
                ${item.Item_Name}
                <span class="badge bg-danger rounded-pill">Only ${item.Stock} left</span>
            `;
            alertsList.appendChild(li);
        });

    } catch (err) {
        // 4. Network / CORS / server crash — show user-facing message
        console.error('analyzeData failed:', err);
        alert('Network Error: Could not connect to the AI engine. Please check your connection.');
    } finally {
        // 5. Always reset button regardless of success or failure
        btn.disabled = false;
        btn.innerHTML = 'Analyze Data';
    }
}
</script>

</body>
</html>
